<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IDPS Sign In</title><link rel="stylesheet" href="/assets/style.css"><link rel="icon" href="data:,"></head>
<body>
<div class="login-wrapper">
  <div class="login">
    <div class="login-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <rect x="9" y="10" width="6" height="5" rx="1" fill="currentColor"/>
          <path d="M10 10V8.5a2 2 0 1 1 4 0V10"/>
        </svg>
      </div>
      <div>
        <h1 class="brand-title">IDPS</h1>
        <small class="brand-sub">Intrusion Detection &amp; Prevention</small>
      </div>
    </div>
    <p class="sub" style="margin-top:14px">Sign in to your security operations dashboard.</p>
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Enter administrator password" autofocus>
    <button class="btn pri" id="go">Sign In</button>
    <div class="err" id="err"></div>
    <p class="hint">Your password was generated when the system first started. Reset anytime via: <span class="mono">python3 manage.py set-password</span></p>
  </div>
</div>
<script src="/assets/login.js"></script></body></html>
